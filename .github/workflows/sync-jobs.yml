name: Sync job postings

# GitHub Actions cron is UTC-only and has no DST awareness, so both the EDT
# (17:00 UTC) and EST (16:00 UTC) offsets for noon ET are scheduled; the
# guard step below no-ops whichever one doesn't land on the true local hour.
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against the non-DST-matching cron trigger
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" != "12" ]; then
            echo "Not noon ET (it's $hour:00 ET) — skipping, the other cron trigger will fire this."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: env.SKIP != 'true'
        run: npm ci

      - name: Import job postings
        if: env.SKIP != 'true'
        run: npm run import:job-postings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
