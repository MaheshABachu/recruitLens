name: Sync job postings

# Every 20 minutes (GitHub Actions cron is UTC; minute-level cadence makes
# the DST offset irrelevant). Scheduled runs can be delayed or dropped under
# load, so this is best-effort, not a hard SLA. Overlapping runs are harmless —
# import:job-postings upserts on url_key — but the concurrency group below
# skips a new run while one is still in flight anyway.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Import job postings
        run: npm run import:job-postings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
