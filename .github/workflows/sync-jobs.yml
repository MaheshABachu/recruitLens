name: Sync job postings

# GitHub Actions cron is UTC-only and has no DST awareness, so both the EDT
# (17:00 UTC) and EST (16:00 UTC) offsets for noon ET are scheduled. No hour
# guard: scheduled runs are frequently delayed well past their trigger time
# (observed ~9h late), which made an exact-hour guard skip real syncs more
# often than it filtered the redundant trigger. Both firing on the same day
# is harmless — import:job-postings upserts on url_key.
on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Import job postings
        run: npm run import:job-postings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
