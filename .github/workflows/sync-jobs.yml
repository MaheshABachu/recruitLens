name: Sync job and internship postings

# Every 30 minutes (GitHub Actions cron is UTC; minute-level cadence makes
# the DST offset irrelevant). Scheduled runs can be delayed or dropped under
# load, so this is best-effort, not a hard SLA. Overlapping runs are harmless —
# import:job-postings upserts on url_key — but the concurrency group below
# skips a new run while one is still in flight anyway.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Import job and internship postings
        run: npm run import:job-postings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Emails users new postings that match their job alerts
      # (scripts/send-job-alerts.ts). Daily digests go out on whichever run
      # lands in each user's 9am hour. Skips itself until RESEND_API_KEY is
      # set, and a failure here shouldn't mark the postings sync as failed.
      - name: Send job alerts
        continue-on-error: true
        run: npm run send:alerts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Emails free-trial users "your trial ends in 2 days / tomorrow / today"
      # (scripts/send-trial-reminders.ts). Each reminder goes out once per user.
      - name: Send trial reminders
        continue-on-error: true
        run: npm run send:trial-reminders
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      # Looks up logo domains for companies that are new since the last run.
      # A failure here shouldn't mark the postings sync as failed.
      - name: Fill company logo domains
        continue-on-error: true
        run: npm run import:company-domains
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOGO_DEV_SECRET_KEY: ${{ secrets.LOGO_DEV_SECRET_KEY }}
